[package]
name = "markl"
version = "0.2.0"
description = "A lightweight markdown editor"
license = "GPL-3.0-only"
repository = "https://github.com/heyplusyou/markL"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, see https://github.com/rust-lang/cargo/issues/8519
name = "markl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
percent-encoding = "2.3"
rfd = { version = "0.16", default-features = false, features = ["gtk3", "common-controls-v6"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5.5"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
